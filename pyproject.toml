[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cola-dlm"
version = "0.1.0"
description = "Local reproduction scaffold for Cola DLM."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.scripts]
train_vae_stage1 = "cola_dlm.train_vae_stage1:main"
train_stage2 = "cola_dlm.train_stage2:main"

[project.optional-dependencies]
tokenizer = [
    "transformers>=4.40",
]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cola_dlm*"]
